services:
  postgres:
    image: postgres:16
    container_name: youtube_analytics_postgres
    environment:
      POSTGRES_DB: youtube_analytics
      POSTGRES_USER: youtube_user
      POSTGRES_PASSWORD: youtube_password
    ports:
      - "5433:5432" #HOST_PORT:CONTAINER_PORT
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_user -d youtube_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
